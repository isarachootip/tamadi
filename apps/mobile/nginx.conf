server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Deep Links: iOS Universal Links & Android App Links must return JSON (never SPA HTML)
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Prevent stale PWA bootstrap & service worker caching across deployments
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|wasm|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # GoRouter PathUrlStrategy SPA fallback (/products/:id, /sellers/:id, /cart, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
